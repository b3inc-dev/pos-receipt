# 公開用アプリ（App Store 販売用）
# デプロイ先: https://pos-receipt.onrender.com
# 使い方: shopify app config use shopify.app.public.toml のあと shopify app deploy

client_id = "5c0909e598067f0376e701295c9a938d"
name = "POS Receipt"
application_url = "https://pos-receipt.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

# GDPR 必須コンプライアンス Webhook（topics ではなく compliance_topics を使用）
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[[webhooks.subscriptions]]
topics = ["orders/updated"]
uri = "/webhooks/orders/updated"

# 会計の前に入れた商品券の額面がある注文だけ、作成時に商品券調整を自動で登録する（会計後の画面の予備。docs/VOUCHER_CART_ENTRY.md）
[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[access_scopes]
scopes = "read_orders,read_locations,read_gift_cards,read_products,write_draft_orders,write_orders"

[auth]
redirect_urls = [ "https://pos-receipt.onrender.com" ]
