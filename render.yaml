# Render Blueprint 参考（ダッシュボード設定と合わせること）
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pos-receipt
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    # 重要: 古い「npx prisma migrate deploy && npx react-router-serve」は使わない
    # POS の CORS は server.js が処理するため npm run start を使う
    preDeployCommand: bash scripts/render-migrate.sh
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
