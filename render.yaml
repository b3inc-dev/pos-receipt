# Render Blueprint 参考（ダッシュボードと合わせること）
# https://render.com/docs/blueprint-spec
#
# 既存サービスがある場合は npm run render:full-deploy（RENDER_API_KEY 要）で
# Build / Pre-Deploy / Start を API から揃えられます。

services:
  - type: web
    name: pos-receipt
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npm run render:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: pos-receipt-ciara
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npm run render:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_DISTRIBUTION
        value: inhouse
