name: Isolated settlement lock PostgreSQL
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: isolated-pg-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      ISOLATED_PG_ACCEPTANCE_URL: postgresql://postgres@localhost:5432/postgres
      ISOLATED_PG_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run setup
      - name: Prove old owner cleanup fails against real PostgreSQL
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, re
          source = pathlib.Path("app/services/settlementLock.server.ts")
          fixed = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output(["git", "show", "8cf81df715901f686b8c52a740c52c7f76a02138:app/services/settlementLock.server.ts"]))
              result = subprocess.run(["node", "--test", "--test-reporter=tap", "--test-name-pattern=RECEIPT-LOCK-OWNER-001", "tests/settlement-lock.pg-acceptance.mjs"], capture_output=True, text=True)
              print(result.stdout)
              if result.returncode != 1 or "old owner's finally must retain the successor row" not in result.stdout or "# fail 1" not in result.stdout.splitlines():
                  raise SystemExit("Baseline failed for an unexpected reason")
              print("BASELINE_EXPECTED_OWNER_FAILURE=1")
          finally:
              source.write_bytes(fixed)
          assert source.read_bytes() == fixed
          PY
      - name: Prove old cursor cycle is silently accepted
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          p = pathlib.Path("app/services/settlementUpstreamPage.server.ts")
          fixed = p.read_bytes()
          try:
              p.write_bytes(subprocess.check_output(["git", "show", "49231ad89eb09a8c93e9fa8b2ab35f1a6bf19dad:app/services/settlementUpstreamPage.server.ts"]))
              r = subprocess.run(["node", "--test", "--test-reporter=tap", "--test-name-pattern=RECEIPT-CURSOR-CYCLE-001", "tests/settlement-cursor-acceptance.mjs"], capture_output=True, text=True)
              print(r.stdout)
              if r.returncode != 1 or "repeated nonterminal cursor must reject" not in r.stdout or "# fail 1" not in r.stdout.splitlines():
                  raise SystemExit("Baseline failed for an unexpected reason")
              print("BASELINE_EXPECTED_FAILURE=1")
          finally:
              p.write_bytes(fixed)
          assert p.read_bytes() == fixed
          PY
      - run: node --test --test-concurrency=1 --test-reporter=tap tests/isolated-pg-guard.test.mjs tests/settlement-lock.pg-acceptance.mjs tests/settlement-route.pg-acceptance.mjs tests/settlement-cursor-acceptance.mjs tests/settlement-engine-stream-acceptance.mjs
