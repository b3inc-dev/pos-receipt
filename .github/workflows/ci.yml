name: CI

on:
  pull_request:
    # stacked PR（feature → feature）でも Checks を走らせる
    branches: ["**"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          # schema 生成のみ。実 DB には接続しない
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"

      - name: Verify toml ↔ APP_MODE mapping
        run: npm run verify:toml-app-mode

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # react-router / Shopify アプリのビルドに必要なプレースホルダ（秘密は入れない）
          SHOPIFY_API_KEY: "ci-placeholder"
          SHOPIFY_API_SECRET: "ci-placeholder"
          SCOPES: "read_orders,read_locations"
          SHOPIFY_APP_URL: "https://example.com"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
