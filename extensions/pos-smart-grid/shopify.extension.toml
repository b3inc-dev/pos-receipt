api_version = "2026-07"

# ============================================================
# 返金（ホームタイル + 取引詳細メニュー）。商品券は下の「商品券」タイルに分けた（T の決定 2026-11-23）
# name … POS のタイル一覧・取引詳細メニューのラベル（同一）
# タイル上の文言は SpecialRefundTile.jsx の heading / subheading
# 取引詳細を「特殊返金調整」と短く出す行は pos-voucher-adjustment と別拡張で分割
# ============================================================
[[extensions]]
type = "ui_extension"
name = "返金 / 返金方法変更"
uid = "149c1d23-b280-f51c-42ee-3a558fd9cf8a2b8ba0cd"
handle = "pos-special-refund"
description = "返金 / 返金方法変更"

[[extensions.targeting]]
module = "./src/SpecialRefundTile.jsx"
target = "pos.home.tile.render"

[[extensions.targeting]]
module = "./src/SpecialRefundModal.jsx"
target = "pos.home.modal.render"

[[extensions.targeting]]
module = "./src/SpecialRefundOrderAction.jsx"
target = "pos.order-details.action.menu-item.render"

# 返品・交換が終わった画面: その注文に返金の予約があれば、その場で付け替えて結果を一行で出す（docs/REFUND_RESERVATION.md）
[[extensions.targeting]]
module = "./src/RefundReservationPostReturnBlock.jsx"
target = "pos.return.post.block.render"

[[extensions.targeting]]
module = "./src/RefundReservationPostReturnBlock.jsx"
target = "pos.exchange.post.block.render"

# 返品・交換が終わった画面の「管理」の行「返金の手段の変更」→ その注文の返金の画面（T 2026-11-24）
[[extensions.targeting]]
module = "./src/RefundPostReturnAction.jsx"
target = "pos.return.post.action.menu-item.render"

[[extensions.targeting]]
module = "./src/SpecialRefundModal.jsx"
target = "pos.return.post.action.render"

[[extensions.targeting]]
module = "./src/RefundPostReturnAction.jsx"
target = "pos.exchange.post.action.menu-item.render"

[[extensions.targeting]]
module = "./src/SpecialRefundModal.jsx"
target = "pos.exchange.post.action.render"

# ============================================================
# 商品券（会計前の額面入力・後からの釣銭調整・会計後の自動登録。ホームタイルは任意で追加）
# タイルをスマートグリッドに置かなくても、取引詳細メニュー表示のために tile target を定義
# ============================================================
[[extensions]]
type = "ui_extension"
name = "商品券 / 会計前の入力・釣銭調整"
uid = "b8e4f2a1-6c3d-4e5f-9a0b-1d2e3f4a5b6c7d8e9f0a"
handle = "pos-voucher-adjustment"
description = "商品券 / 会計前の入力・釣銭調整"

[[extensions.targeting]]
module = "./src/VoucherTile.jsx"
target = "pos.home.tile.render"

# カートに商品があれば会計前の額面入力、無ければ一覧（最初の絞り込みは「商品券釣有り」）
[[extensions.targeting]]
module = "./src/VoucherModal.jsx"
target = "pos.home.modal.render"

[[extensions.targeting]]
module = "./src/VoucherOrderAction.jsx"
target = "pos.order-details.action.menu-item.render"

# 会計後の画面: 会計の前に入れた額面があれば、商品券調整を自動で登録して一行で知らせる（docs/VOUCHER_CART_ENTRY.md）
[[extensions.targeting]]
module = "./src/VoucherPostPurchaseBlock.jsx"
target = "pos.purchase.post.block.render"

# 会計が終わった画面の「管理」の行「商品券釣銭調整」→ その注文の商品券の画面（T 2026-11-24）
[[extensions.targeting]]
module = "./src/VoucherOrderAction.jsx"
target = "pos.purchase.post.action.menu-item.render"

[[extensions.targeting]]
module = "./src/VoucherModal.jsx"
target = "pos.purchase.post.action.render"

