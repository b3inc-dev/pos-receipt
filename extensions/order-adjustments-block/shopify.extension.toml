api_version = "2026-07"

# ============================================================
# 注文ページ（Shopify 管理画面の注文詳細）のブロック
# その注文の特殊返金・商品券調整（注文メタフィールド pos.adjustments）を出し、
# 「変更」でアプリの注文ごとの記録の画面（/app/order-adjustments）を開く。
# 記録の形: docs/ORDER_ADJUSTMENTS_METAFIELD.md
# ============================================================
[[extensions]]
type = "ui_extension"
name = "返金・商品券釣銭調整"
handle = "order-adjustments-block"
description = "注文の返金方法変更・商品券釣銭調整の記録を見て、アプリで変更する"

[[extensions.targeting]]
module = "./src/OrderAdjustmentsBlock.jsx"
target = "admin.order-details.block.render"
